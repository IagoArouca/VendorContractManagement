# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.0"
metadata:
  name: sapanalytics.vendorcontracts.vendorcontractsui
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-cpp
      afterTask: generateCachebusterInfo
      configuration:
        enabled: true
        taskConfiguration:
          UI5ApplicationName: vendorcontractsui
          target:
            destination: HTML5Repository
    - name: ui5-task-zipper
      afterTask: deploy-to-cpp
      configuration:
        archiveName: sapanalyticsvendorcontractsvendorcontractsui
        relativePaths: true
        additionalFiles:
          - xs-app.json